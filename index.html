<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Caveat:wght@400;600&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wood: #5a3e2b;      /* wood brown */
    --wood-deep: #3b2a1e;
    --sand: #e8dcc2;      /* sand */
    --sand-light: #f3ecdb;
    --sage: #7d8b6a;      /* muted sage */
    --sage-deep: #4f5d44;
    --ink: #3b2a1e;
    --muted: #7a6a58;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--sand-light);
    color: var(--ink);
    font-family: "Nunito Sans", sans-serif;
    line-height: 1.7;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--wood);
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 38px);
    color: var(--sand-light);
    padding: 72px 24px 64px;
    text-align: center;
    border-bottom: 8px solid var(--sage);
  }
  header h1 {
    font-family: "Lora", serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    line-height: 1.3;
  }
  header p {
    font-family: "Caveat", cursive;
    color: var(--sand);
    margin-top: 12px;
    font-size: 1.1rem;
  }

  /* ---------- Gallery ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 56px 20px 40px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 36px 28px;
  }
  .card {
    background: #fffaf0;
    padding: 14px 14px 20px;
    border: 1px solid #d9c9a8;
    box-shadow: 0 6px 18px rgba(90, 62, 43, .16);
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:nth-child(odd)  { transform: rotate(-.8deg); }
  .card:nth-child(even) { transform: rotate(.7deg); }
  .card:hover, .card:focus-visible {
    transform: rotate(0) translateY(-4px);
    box-shadow: 0 12px 24px rgba(90, 62, 43, .24);
    outline: none;
  }
  .card:focus-visible { outline: 3px solid var(--sage-deep); outline-offset: 3px; }
  .photo {
    aspect-ratio: 4 / 3;
    background: var(--sand);
    overflow: hidden;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: .9rem;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card h2 {
    font-family: "Lora", serif;
    font-size: 1.15rem;
    margin-top: 14px;
    color: var(--wood);
  }
  .card .cap {
    font-family: "Caveat", cursive;
    font-size: 1.3rem;
    line-height: 1.35;
    margin-top: 4px;
    color: var(--ink);
  }
  .card time {
    display: inline-block;
    margin-top: 10px;
    font-size: .85rem;
    color: var(--sage-deep);
    border-top: 2px solid var(--sage);
    padding-top: 4px;
  }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }

  footer { text-align: center; color: var(--muted); padding: 24px 20px 56px; font-size: .9rem; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(59, 42, 30, .93);
    display: none;
    align-items: center; justify-content: center;
    padding: 24px; z-index: 10;
  }
  .lightbox.open { display: flex; }
  .lb-inner { max-width: 900px; width: 100%; text-align: center; color: var(--sand-light); }
  .lb-inner img {
    max-width: 100%; max-height: 68vh;
    border: 10px solid #fffaf0;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  .lb-inner h3 { font-family: "Lora", serif; margin-top: 18px; font-size: 1.4rem; }
  .lb-inner p  { font-family: "Caveat", cursive; margin-top: 6px; }
  .lb-inner small { color: var(--sand); }
  .lb-btn {
    position: absolute; background: var(--sage-deep); color: var(--sand-light);
    border: none; width: 46px; height: 46px; border-radius: 50%;
    font-size: 1.4rem; cursor: pointer;
  }
  .lb-btn:hover, .lb-btn:focus-visible { background: var(--sage); outline: 2px solid var(--sand); }
  .lb-close { top: 18px; right: 18px; }
  .lb-prev  { left: 14px; top: 50%; }
  .lb-next  { right: 14px; top: 50%; }

  @media (max-width: 600px) {
    .lb-prev, .lb-next { top: auto; bottom: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------- Owner upload panel ---------- */
  .owner-btn { background: none; border: 1px solid var(--sage); color: var(--sage-deep); padding: 6px 16px; border-radius: 999px; font: inherit; cursor: pointer; }
  .owner-btn:hover, .owner-btn:focus-visible { background: var(--sage); color: var(--sand-light); outline: none; }
  .admin { position: fixed; inset: 0; background: rgba(59,42,30,.7); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; overflow-y: auto; }
  .admin.open { display: flex; }
  .panel { background: var(--sand-light); width: 100%; max-width: 480px; padding: 24px; border-top: 8px solid var(--sage); max-height: 92vh; overflow-y: auto; }
  .panel h2 { font-family: "Lora", serif; color: var(--wood); margin-bottom: 12px; }
  .panel h3 { font-family: "Lora", serif; font-size: 1rem; color: var(--wood); margin: 18px 0 6px; }
  .panel label { display: block; font-size: .9rem; margin-top: 10px; color: var(--muted); }
  .panel input, .panel textarea { width: 100%; padding: 8px 10px; font: inherit; color: var(--ink); background: #fffaf0; border: 1px solid #cdbb98; }
  .panel input:focus, .panel textarea:focus { outline: 2px solid var(--sage-deep); }
  .panel .row { display: flex; gap: 8px; margin-top: 16px; }
  .panel button { font: inherit; padding: 9px 18px; border: none; cursor: pointer; background: var(--sage-deep); color: var(--sand-light); }
  .panel button.ghost { background: transparent; color: var(--wood); border: 1px solid var(--wood); }
  .panel button:disabled { opacity: .5; cursor: wait; }
  .panel details { margin-top: 14px; }
  .panel .note { font-size: .82rem; color: var(--muted); margin-top: 6px; }
  #status { margin-top: 12px; font-size: .92rem; min-height: 1.4em; }
  #status.err { color: #8a3b2a; }
</style>
</head>
<body>

<header>
  <h1>Our Memories</h1>
  <p>Little moments, kept close.</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer><p>Made with love, one photo at a time.</p><p style="margin-top:12px"><button class="owner-btn" id="openAdmin" type="button">Add a memory</button></p></footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">×</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">›</button>
  <div class="lb-inner">
    <img id="lbImg" alt="">
    <h3 id="lbTitle"></h3>
    <p id="lbCap"></p>
    <small id="lbDate"></small>
  </div>
</div>

<div class="admin" id="admin" role="dialog" aria-modal="true" aria-label="Add a memory">
  <div class="panel">
    <h2>Add a memory</h2>
    <label for="f-file">Photo</label>
    <input type="file" id="f-file" accept="image/*">
    <label for="f-title">Title</label>
    <input type="text" id="f-title" maxlength="80">
    <label for="f-cap">Caption</label>
    <textarea id="f-cap" rows="3" maxlength="300"></textarea>
    <label for="f-date">Date</label>
    <input type="date" id="f-date">
    <details id="settings">
      <summary>GitHub settings (set once)</summary>
      <label for="s-owner">GitHub username</label><input id="s-owner" autocomplete="off">
      <label for="s-repo">Repository name</label><input id="s-repo" autocomplete="off">
      <label for="s-branch">Branch</label><input id="s-branch" value="main" autocomplete="off">
      <label for="s-token">Personal access token</label><input id="s-token" type="password" autocomplete="off">
      <p class="note">The token is saved only in this browser. Use a fine-grained token limited to this one repository with Contents: Read and write. Never share it.</p>
    </details>
    <p id="status" role="status"></p>
    <div class="row">
      <button type="button" id="saveBtn">Upload</button>
      <button type="button" class="ghost" id="cancelBtn">Close</button>
    </div>
  </div>
</div>

<script>
  const grid = document.getElementById("grid");
  let items = [];

  const fmtDate = (d) => {
    const dt = new Date(d);
    return isNaN(dt) ? "" : dt.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  };

  async function load() {
    try {
      const r = await fetch("memories.json?v=" + Date.now());
      items = await r.json();
    } catch (e) { items = []; }
    render();
  }

  function render() {
    items.sort((a, b) => new Date(b.date) - new Date(a.date));
    grid.innerHTML = "";
    if (!items.length) {
      grid.innerHTML = '<p class="empty">No memories yet. Use "Add a memory" below to post your first photo.</p>';
      return;
    }
    items.forEach((m, i) => {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      const photo = document.createElement("div");
      photo.className = "photo";
      const img = document.createElement("img");
      img.src = m.image; img.alt = m.title || ""; img.loading = "lazy";
      img.onerror = () => { photo.textContent = "Photo not ready yet. Refresh in a minute."; };
      photo.appendChild(img);
      const h = document.createElement("h2"); h.textContent = m.title || "";
      const cap = document.createElement("p"); cap.className = "cap"; cap.textContent = m.caption || "";
      const t = document.createElement("time"); t.textContent = fmtDate(m.date);
      card.append(photo, h, cap, t);
      card.addEventListener("click", () => openLb(i));
      grid.appendChild(card);
    });
  }

  // ---------- Lightbox ----------
  const lb = document.getElementById("lightbox");
  let cur = 0;
  function show(i) {
    cur = (i + items.length) % items.length;
    const m = items[cur];
    document.getElementById("lbImg").src = m.image;
    document.getElementById("lbImg").alt = m.title || "";
    document.getElementById("lbTitle").textContent = m.title || "";
    document.getElementById("lbCap").textContent = m.caption || "";
    document.getElementById("lbDate").textContent = fmtDate(m.date);
  }
  function openLb(i) { show(i); lb.classList.add("open"); document.getElementById("lbClose").focus(); }
  function closeLb() { lb.classList.remove("open"); }
  document.getElementById("lbClose").onclick = closeLb;
  document.getElementById("lbPrev").onclick = () => show(cur - 1);
  document.getElementById("lbNext").onclick = () => show(cur + 1);
  lb.addEventListener("click", (e) => { if (e.target === lb) closeLb(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeLb(); closeAdmin(); }
    if (!lb.classList.contains("open")) return;
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "ArrowRight") show(cur + 1);
  });

  // ---------- Owner upload (saves to your GitHub repo) ----------
  const $ = (id) => document.getElementById(id);
  const admin = $("admin"), statusEl = $("status");
  const KEY = "memories-github-settings";

  function loadCfg() {
    let c = {};
    try { c = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
    const host = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
    const repo = location.pathname.split("/")[1] || "";
    $("s-owner").value = c.owner || host;
    $("s-repo").value = c.repo || repo;
    $("s-branch").value = c.branch || "main";
    $("s-token").value = c.token || "";
    $("settings").open = !c.token;
  }
  function getCfg() {
    const c = { owner: $("s-owner").value.trim(), repo: $("s-repo").value.trim(), branch: $("s-branch").value.trim() || "main", token: $("s-token").value.trim() };
    try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {}
    return c;
  }
  function say(msg, err) { statusEl.textContent = msg; statusEl.className = err ? "err" : ""; }
  function openAdmin() { loadCfg(); $("f-date").value = new Date().toISOString().slice(0, 10); say(""); admin.classList.add("open"); }
  function closeAdmin() { admin.classList.remove("open"); }
  $("openAdmin").onclick = openAdmin;
  $("cancelBtn").onclick = closeAdmin;

  const toB64 = (blob) => new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(",")[1]); fr.readAsDataURL(blob); });
  async function shrink(file) {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return toB64(await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85)));
  }
  const utf8b64 = (str) => btoa(unescape(encodeURIComponent(str)));
  const b64utf8 = (b64) => decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));

  async function gh(cfg, path, opts = {}) {
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
    const r = await fetch(opts.method === "PUT" ? url : url + "?ref=" + cfg.branch, {
      ...opts,
      headers: { Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" }
    });
    if (r.status === 404 && !opts.method) return null;
    if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "GitHub rejected the token. Check its permissions." : "GitHub error " + r.status);
    return r.json();
  }

  $("saveBtn").onclick = async () => {
    const file = $("f-file").files[0];
    const cfg = getCfg();
    if (!file) return say("Choose a photo first.", true);
    if (!cfg.owner || !cfg.repo || !cfg.token) { $("settings").open = true; return say("Fill in the GitHub settings first.", true); }
    const btn = $("saveBtn"); btn.disabled = true;
    try {
      say("Preparing photo…");
      const slug = file.name.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "photo";
      const photoPath = `photos/${Date.now()}-${slug}.jpg`;
      const content = await shrink(file);

      say("Uploading photo…");
      await gh(cfg, photoPath, { method: "PUT", body: JSON.stringify({ message: "Add photo", content, branch: cfg.branch }) });

      say("Saving caption…");
      const cur = await gh(cfg, "memories.json");
      const list = cur ? JSON.parse(b64utf8(cur.content)) : [];
      const entry = { image: photoPath, title: $("f-title").value.trim(), caption: $("f-cap").value.trim(), date: $("f-date").value };
      list.push(entry);
      await gh(cfg, "memories.json", { method: "PUT", body: JSON.stringify({ message: "Add memory", content: utf8b64(JSON.stringify(list, null, 2)), branch: cfg.branch, ...(cur ? { sha: cur.sha } : {}) }) });

      items.push(entry); render();
      $("f-file").value = ""; $("f-title").value = ""; $("f-cap").value = "";
      say("Done! Your photo will appear for everyone in 1–2 minutes.");
    } catch (e) {
      say(e.message || "Upload failed.", true);
    } finally { btn.disabled = false; }
  };

  load();
</script>
</body>
</html>
